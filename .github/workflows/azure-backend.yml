name: Deploy backend to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "scripts/package-azure.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:azure
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
      - name: Stage deployment package
        run: node scripts/package-azure.mjs release
      - name: Deploy App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release
